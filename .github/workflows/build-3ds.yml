name: Build The Choicer Voicer for Old 3DS

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-old-3ds:
    name: Build native 3DSX and SD install bundle
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # The image normally includes 3ds-zlib. This pinned source checkout is a
      # fallback so a package-server outage cannot block the build.
      - name: Fetch pinned zlib fallback source
        uses: actions/checkout@v4
        with:
          repository: madler/zlib
          ref: v1.3.1
          path: .build-deps/zlib-src
          persist-credentials: false

      - name: Check native project files
        shell: bash
        run: |
          set -euo pipefail
          test -f 3ds_port/Makefile
          test -f 3ds_port/source/main.c
          test -f 3ds_port/icon.png
          test -f tools/prepare_3ds_assets.py
          test -f tools/prepare_3ds_dub_packs.py
          test -f tools/test_3ds_dub_packs.py
          test -f tools/test_asset_optimizer.py
          test -f tools/test_native_pack_loader.py
          test -f tools/test_dub_pack_browser.py
          test -f tools/test_dub_pack_browser.c
          test -f tools/test_dub_workflow.py
          test -f tools/test_dub_manifest.py
          test -f tools/test_dub_manifest.c
          test -f tools/test_tcv_blit.c
          test -f tools/test_pack_loader.c
          test -f tools/test_screen_flush.c
          test -f tools/test_live_waveform.c
          test -f tools/build_3ds_in_container.sh
          test -f packs_voice/README.txt
          test -f "packs_voice/verity song/_pack_info.ini"
          test -f "packs_voice/verity song/dub_video.ogv"
          test -f "packs_voice/verity song/001_Verity.txt"
          sh -n tools/build_3ds_in_container.sh
          if grep -Eq '(^|[[:space:]])(dkp-pacman|pacman)[[:space:]]+-Sy' .github/workflows/build-3ds.yml tools/build_3ds_in_container.sh; then
            echo "Unexpected devkitPro package-database refresh found; this build uses the SDK image and pinned source fallback." >&2
            exit 1
          fi
          echo "Native source, container build script, pack converter, and custom pack input folder found."

      - name: Install original-asset conversion tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pil zip build-essential zlib1g-dev

      - name: Test dub video/audio/image preprocessing
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/test_3ds_dub_packs.py
          python3 tools/test_asset_optimizer.py

      - name: Test the native C pack loader
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/test_native_pack_loader.py
          python3 tools/test_dub_pack_browser.py
          python3 tools/test_dub_workflow.py
          python3 tools/test_dub_manifest.py
          CFLAGS="-std=gnu11 -O0 -ffunction-sections -fdata-sections -Wno-implicit-function-declaration -Wno-int-conversion -Wno-pointer-to-int-cast -Wno-incompatible-pointer-types -Wno-unused-parameter -Wno-unused-function -I tools/3ds_test_stub"
          cc $CFLAGS tools/test_screen_flush.c -Wl,--gc-sections -lz -lm -o /tmp/test_screen_flush
          /tmp/test_screen_flush
          cc $CFLAGS tools/test_tcv_blit.c -Wl,--gc-sections -lz -lm -o /tmp/test_tcv_blit
          /tmp/test_tcv_blit
          cc $CFLAGS tools/test_live_waveform.c -Wl,--gc-sections -lz -lm -o /tmp/test_live_waveform
          /tmp/test_live_waveform
          python3 - <<'PYTEST'
          from pathlib import Path
          source = Path("3ds_port/source/main.c").read_text(encoding="utf-8")
          assert '#define ROOT "romfs:/tcv"' in source
          assert '#define USER_ROOT "sdmc:/3ds/TheChoicerVoicer3DS_User"' in source
          assert 'sdmc:/luma/3ds' not in source
          assert 'SD:/luma/3ds' not in source
          assert 'R_SUCCEEDED(romfsInit())' in source
          assert '#define RENDER_VBLANK_DIVISOR 2u' in source
          assert 'if (render_divider >= RENDER_VBLANK_DIVISOR)' in source
          assert 'if (w == (int)v->width * 2 && h == (int)v->height * 2)' in source
          assert 'static inline uint32_t tcv_argb_at' in source
          assert 'static int16_t mic_wave_snapshot[MIC_WAVE_SNAPSHOT_SAMPLES]' in source
          assert 'RECORDING STOPPED - TAKE SAVED' in source
          assert 'static void draw_game_status_line(void)' in source
          assert 'draw_tcv_video(&top_canvas, 40, 57, 320, 180)' in source[source.index('static void page_dub(void) {'):source.index('static void page_packs(void) {')]
          assert 'if (redraw_pending)' in source
          replay_start = source.index('static void start_dub_replay(void) {')
          replay_end = source.index('static void play_current_clip(void) {', replay_start)
          replay = source[replay_start:replay_end]
          assert 'No voice takes saved yet' in replay
          pump_start = source.index('static void dub_replay_pump(void) {')
          pump_end = source.index('static void start_dub_replay(void) {', pump_start)
          pump = source[pump_start:pump_end]
          assert 'play_dub_overlay_wav(voice_clips[idx].path)' not in pump
          print("PASS: embedded data root, writable user-data path, RomFS startup, 30 FPS cap, cached video blit, and recorded-take-only Watch Dub checks.")
          PYTEST

      - name: Prepare compact runtime assets for embedding in the application
        shell: bash
        run: |
          set -euo pipefail
          rm -rf 3ds_port/romfs
          mkdir -p 3ds_port/romfs/tcv
          python3 tools/prepare_3ds_assets.py \
            --source "$GITHUB_WORKSPACE" \
            --output "$GITHUB_WORKSPACE/3ds_port/romfs/tcv"
          test -s "3ds_port/romfs/tcv/assets_native/logo_banner.rgba"
          test -s "3ds_port/romfs/tcv/assets_native/font_small.rgba"
          test -s "3ds_port/romfs/tcv/audio/music/maintheme.wav"
          test -d "3ds_port/romfs/tcv/packs_voice"
          test -d "3ds_port/romfs/tcv/packs_menu"
          test -f "3ds_port/romfs/tcv/ROMFS-INFO.txt"
          test ! -d "3ds_port/romfs/tcv/source_assets"
          python3 - <<'PYWAV'
          import wave
          from pathlib import Path
          root = Path("3ds_port/romfs/tcv")
          music = ["audio/music/maintheme.wav", "audio/music/studio_music_loop_final.wav",
                   "audio/music/cartridge_loop.wav", "audio/music/use_tutorial_loop.wav",
                   "audio/music/tcv_polling.wav"]
          for rel in music:
              path = root / rel
              with wave.open(str(path), "rb") as wav:
                  data_bytes = wav.getnframes() * wav.getnchannels() * wav.getsampwidth()
                  if wav.getnchannels() != 1 or wav.getsampwidth() != 2 or data_bytes > 4 * 1024 * 1024:
                      raise SystemExit(f"Default runtime music is incompatible with the native audio cap: {rel} ({data_bytes} data bytes)")
          print("PASS: bundled default music is mono PCM16 and within the 4-MiB native playback limit.")
          PYWAV
          echo "Embedded runtime tree size:"
          du -sh 3ds_port/romfs

      - name: Pull official devkitPro ARM image
        run: docker pull devkitpro/devkitarm:latest

      - name: Build Old 3DS homebrew
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/work" \
            --workdir /work/3ds_port \
            devkitpro/devkitarm:latest \
            sh /work/tools/build_3ds_in_container.sh

      - name: Verify binary and prepare install bundle
        shell: bash
        run: |
          set -euo pipefail
          test -s 3ds_port/TheChoicerVoicer3DS.3dsx
          test -s 3ds_port/TheChoicerVoicer3DS.smdh
          python3 - <<'PY'
          from pathlib import Path
          binary = Path("3ds_port/TheChoicerVoicer3DS.3dsx")
          with binary.open("rb") as f:
              magic = f.read(4)
          if magic != b"3DSX":
              raise SystemExit(f"Invalid 3DSX header: {magic!r}")
          print(f"Verified 3DSX header: {binary} ({binary.stat().st_size} bytes)")
          PY
          mkdir -p 3ds_port/dist/SD/3ds
          cp 3ds_port/TheChoicerVoicer3DS.3dsx 3ds_port/dist/SD/3ds/
          cp 3ds_port/TheChoicerVoicer3DS.smdh 3ds_port/dist/SD/3ds/
          cat > 3ds_port/dist/SD/README-INSTALL.txt <<'EOF'
          The Choicer Voicer — Old 3DS native app

          The game's read-only artwork, music, starter packs and bundled dub packs
          are embedded in TheChoicerVoicer3DS.3dsx. There is no assets folder to copy
          and no need to replace SD:/3ds/The Choicer Voicer/.

          Copy /3ds/TheChoicerVoicer3DS.3dsx and /3ds/TheChoicerVoicer3DS.smdh to
          the 3ds folder on the SD card. On first run the app creates writable data
          under SD:/3ds/TheChoicerVoicer3DS_User/ for settings, saves and recordings.

          Optional preconverted custom packs go in
          SD:/3ds/TheChoicerVoicer3DS_User/packs_voice/. The old
          SD:/3ds/The Choicer Voicer/packs_voice/ path is read as a compatibility
          fallback if it already exists, but the app never writes to that folder.

          Built-in packs are preprocessed during the build into 160x90 RGB565 TCV
          video at 10 fps, PCM16 WAV voice companions and compact TCVR artwork.
          Source Godot project files stay in the repository and are not loaded by
          the native runtime. Back up your SD card before replacing the .3dsx.
          EOF
          cd 3ds_port/dist/SD
          zip -q -r -1 ../../TheChoicerVoicer-Old3DS-SD-Install.zip .
          cd ../..
          ls -lh TheChoicerVoicer3DS.3dsx TheChoicerVoicer3DS.smdh TheChoicerVoicer-Old3DS-SD-Install.zip

      - name: Upload Old 3DS build and SD installation package
        uses: actions/upload-artifact@v4
        with:
          name: TheChoicerVoicer-Old3DS
          if-no-files-found: error
          path: |
            3ds_port/TheChoicerVoicer3DS.3dsx
            3ds_port/TheChoicerVoicer3DS.smdh
            3ds_port/TheChoicerVoicer-Old3DS-SD-Install.zip
